<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse {
        0% { r: 28; opacity: 0.8; }
        50% { r: 30; opacity: 1; }
        100% { r: 28; opacity: 0.8; }
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      .center-lime {
        animation: pulse 2s ease-in-out infinite;
      }
      .circles {
        animation: fadeIn 0.8s ease-in-out forwards;
      }
    </style>
  </defs>
  
  <!-- Dark teal background (splash only, will be transparent in app) -->
  <rect width="192" height="192" fill="#1a3a36" opacity="0.95"/>
  
  <!-- Animated circles with staggered fade-in -->
  <g class="circles" style="animation-delay: 0s">
    <!-- Top left white circle -->
    <circle cx="48" cy="48" r="24" fill="#f5f5f5"/>
  </g>
  
  <g class="circles" style="animation-delay: 0.1s">
    <!-- Top center: white outer + lime green inner (animated) -->
    <circle cx="96" cy="48" r="36" fill="#f5f5f5"/>
    <circle cx="96" cy="48" r="28" fill="#c8ff00" class="center-lime"/>
  </g>
  
  <g class="circles" style="animation-delay: 0.2s">
    <!-- Top right white circle -->
    <circle cx="144" cy="48" r="24" fill="#f5f5f5"/>
  </g>
  
  <g class="circles" style="animation-delay: 0.3s">
    <!-- Middle left white circle -->
    <circle cx="24" cy="96" r="24" fill="#f5f5f5"/>
  </g>
  
  <g class="circles" style="animation-delay: 0.4s">
    <!-- Middle right white circle -->
    <circle cx="168" cy="96" r="24" fill="#f5f5f5"/>
  </g>
  
  <g class="circles" style="animation-delay: 0.5s">
    <!-- Bottom left white circle -->
    <circle cx="48" cy="144" r="24" fill="#f5f5f5"/>
  </g>
  
  <g class="circles" style="animation-delay: 0.6s">
    <!-- Bottom center white circle -->
    <circle cx="96" cy="168" r="24" fill="#f5f5f5"/>
  </g>
  
  <g class="circles" style="animation-delay: 0.7s">
    <!-- Bottom right white circle -->
    <circle cx="144" cy="144" r="24" fill="#f5f5f5"/>
  </g>
</svg>
