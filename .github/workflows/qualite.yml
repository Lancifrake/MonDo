name: Qualité

on:
  pull_request:
  push:
    branches: [main]

jobs:
  serveur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/serveur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm qualite
