name: Qualité

on:
  pull_request:
  push:
    branches: [main]

# Le jeton de la CI ne peut que lire le dépôt : une dépendance compromise ne peut ni pousser ni modifier une PR.
permissions:
  contents: read

jobs:
  serveur:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mondo
          POSTGRES_PASSWORD: test-uniquement
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Serveur jetable de l'intégration continue, aucune donnée réelle.
      MONDO_TEST_POSTGRES_URL: postgres://mondo:test-uniquement@localhost:5432/postgres
    defaults:
      run:
        working-directory: src/serveur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm qualite
      # Le serveur compilé démarre, répond sur /sante et s'arrête proprement.
      - run: pnpm build
      - run: pnpm essai-demarrage

  # L'image de production se construit, démarre sans être root et répond sur /sante (simulateurs autorisés
  # hors production) ; en production sans configuration, elle refuse de démarrer.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/serveur/Dockerfile -t mondo-serveur .
      - name: Démarrage vérifié par /sante
        run: |
          docker run -d --name essai -e NODE_ENV=demonstration -e MONDO_PLANIFICATEUR_MINUTES=0 -p 3000:3000 mondo-serveur
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/sante)" = "200" ] && break
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/sante)" = "200"
          test "$(docker exec essai id -u)" != "0"
          docker stop essai
      - name: Refus de démarrer en production sans configuration
        run: |
          if docker run --rm mondo-serveur; then echo "le serveur a démarré en production sans configuration"; exit 1; fi

  contrat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/contrat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm qualite

  slither:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/contrat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6 solc-select==1.2.0
      - run: solc-select install 0.8.28 && solc-select use 0.8.28
      # Échoue dès un constat de gravité faible ou plus (voir slither.config.json).
      - run: slither contracts/RegistreMonDo.sol
